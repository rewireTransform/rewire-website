// Sanitize fields before sending to Airtable:
// - empty strings → null for select/date/link fields
// - number strings → actual numbers for numeric fields
const clean = fields => {
  const out = {};
  for (const [k,v] of Object.entries(fields)) {
    if (k === "Created") continue; // computed field — Airtable rejects writes to it
    if (v === "" || (Array.isArray(v) && v.length === 0)) out[k] = null;
    else out[k] = v;
  }
  // Numeric fields must be numbers not strings
  if (out["Recommended Quote"] !== null && out["Recommended Quote"] !== undefined)
    out["Recommended Quote"] = Number(out["Recommended Quote"]) || null;
  if (out["Sort Order"] !== null && out["Sort Order"] !== undefined)
    out["Sort Order"] = Number(out["Sort Order"]) || 0;
  return out;
};

const AT = async (table, opts = {}) => {
  const { method = "GET", body, filter, sort } = opts;
  // table may be "TableName" or "TableName/recordId" — encode each path segment separately
  // so the "/" between them survives (encodeURIComponent on the whole string turns it into %2F).
  const pathParts = table.split("/").map(encodeURIComponent).join("/");
  let url = `https://api.airtable.com/v0/${BASE_ID}/${pathParts}`;
  const p = new URLSearchParams();
  if (filter) p.set("filterByFormula", filter);
  if (sort) sort.forEach((s,i) => { p.set(`sort[${i}][field]`,s.field); p.set(`sort[${i}][direction]`,s.dir||"asc"); });
  if ([...p].length) url += "?" + p.toString();
  const res = await fetch(url, {
    method,
    headers: { Authorization: `Bearer ${AT_TOKEN}`, "Content-Type": "application/json" },
    // typecast lets writes create new select options on the fly (e.g. a brand-new Tech Stack tag)
    ...(body ? { body: JSON.stringify({ ...body, ...(method!=="GET"?{typecast:true}:{}) }) } : {}),
  });
  if (!res.ok) {
    let detail = "";
    try { const errBody = await res.json(); detail = errBody?.error?.message || errBody?.error?.type || JSON.stringify(errBody); } catch {}
    const err = new Error(`Airtable ${res.status}${detail?`: ${detail}`:""}`);
    console.error("Airtable request failed", { table, opts, status: res.status, detail });
    throw err;
  }
  return res.json();
};
const atList = async (table, opts) => {
  const all = []; let offset;
  do {
    const params = { ...opts }; if (offset) params.offset = offset;
    const data = await AT(table, params);
    all.push(...(data.records||[])); offset = data.offset;
  } while (offset);
  return all;
};
const atCreate = (table, fields) => AT(table, { method:"POST", body:{ fields } });
const atUpdate = (table, id, fields) => AT(`${table}/${id}`, { method:"PATCH", body:{ fields } });
const atDelete = (table, id) => AT(`${table}/${id}`, { method:"DELETE" });

const CSS = `
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .app { display: flex; height: 100vh; overflow: hidden; position: relative; }

    width: 232px; min-width: 232px;
    background: var(--bg); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden;
    transition: transform .25s ease, width .25s ease, min-width .25s ease;
    z-index: 50;

  .sidebar.collapsed { width: 0; min-width: 0; border-right: none; visibility: hidden; }

  @media (max-width: 720px) {
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; transform: translateX(0); visibility: visible; box-shadow: var(--shadow); }
    .sidebar.collapsed { transform: translateX(-100%); width: 232px; min-width: 232px; visibility: visible; }
    .sidebar-overlay { display: block !important; }

  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }

  .sidebar-logo { padding: 20px 16px 16px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 17px; color: var(--text); letter-spacing: -.3px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
  .sidebar-logo-mark { color: var(--blue); }
  .sidebar-logo-sub { display: block; font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--text-3); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
  .sidebar-close { background: none; border: none; cursor: pointer; color: var(--text-3); padding: 4px; border-radius: var(--r); display: none; min-width: 44px; min-height: 44px; align-items: center; justify-content: center; }

  .sidebar-section { padding: 16px 14px 6px; font-family: var(--mono); font-size: 12px; letter-spacing: 1.2px; color: var(--text-3); text-transform: uppercase; flex-shrink: 0; }

  .task-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; margin-bottom: 6px; display: flex; align-items: flex-start; gap: 11px; transition: border-color .12s; cursor: pointer; }
  .task-row:hover, .task-row:focus-visible { border-color: var(--border-hi); outline: none; box-shadow: 0 0 0 2px var(--blue); }
  .task-row.done { opacity: .5; }

  .task-check-wrap { position: relative; flex-shrink: 0; }

/* ── HELPERS ─────────────────────────────────────────────────────────────── */
const fmt        = v => v?.fields || {};
const fmtDate    = d => d ? new Date(d).toLocaleDateString("en-US",{month:"short",day:"numeric"}) : null;
const fmtDateInp = d => { if (!d) return ""; try { return new Date(d).toISOString().split("T")[0]; } catch { return ""; } };
const timeAgo    = d => {
  if (!d) return "";
  const diff = Date.now()-new Date(d), m=Math.floor(diff/60000);
  if (m<1) return "just now"; if (m<60) return `${m}m ago`;
  const h=Math.floor(m/60); if (h<24) return `${h}h ago`;
  return fmtDate(d);
};
const daysSince = d => d ? Math.floor((Date.now()-new Date(d))/86400000) : Infinity;
// Distinct Tech Stack tags used across all clients, sorted alphabetically.
const allTechStackOptions = clients => {
  const set = new Set();
  clients.forEach(c => (fmt(c)["Tech Stack"]||[]).forEach(t=>set.add(t)));
  return [...set].sort();
};
// Frequency count of each tag across clients, sorted most-used first.
const techStackFrequency = clients => {
  const counts = {};
  clients.forEach(c => (fmt(c)["Tech Stack"]||[]).forEach(t=>{ counts[t]=(counts[t]||0)+1; }));
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
};
// Most recent task/comm touch for a client, in days. Used for stale-client flagging.
const lastActivityDays = (clientId, tasks, comms) => {
  const dates = [
    ...tasks.filter(t=>fmt(t).Client?.[0]===clientId).map(t=>fmt(t).Created),
    ...comms.filter(c=>fmt(c).Client?.[0]===clientId).map(c=>fmt(c).Date||fmt(c).Created),
  ].filter(Boolean);
  if (!dates.length) return Infinity;
  return Math.min(...dates.map(daysSince));
};


/* ── NOTIF ───────────────────────────────────────────────────────────────── */
function Notif({ msg, type, onDone }) {
  useEffect(()=>{ const t=setTimeout(onDone,3000); return ()=>clearTimeout(t); },[]);
  return <div role="status" aria-live="polite" className={`notif ${type}`}>{msg}</div>;
}

/* ── BURST EFFECT (task completion) ─────────────────────────────────────── */
function BurstEffect() {
  const dots = Array.from({length:7}, (_,i)=>{
    const angle = (i/7)*2*Math.PI + Math.random()*0.4;
    const dist = 16 + Math.random()*10;
    const tx = Math.cos(angle)*dist, ty = Math.sin(angle)*dist;
    return { id:i, style:{ "--burst-t": `${tx}px ${ty}px`, animationDelay: `${i*15}ms` } };
  });
  return (
    <>
      {dots.map(d=><span key={d.id} className="burst-dot" style={d.style} aria-hidden="true" />)}
      <span className="burst-check" aria-hidden="true">✓</span>
    </>
  );
}

/* ── UNDO TOAST ──────────────────────────────────────────────────────────── */
function UndoToast({ msg, onUndo, onExpire }) {
  useEffect(()=>{ const t=setTimeout(onExpire,5000); return ()=>clearTimeout(t); },[]);
  return (
    <div role="status" aria-live="polite" className="notif" style={{display:"flex",alignItems:"center",gap:12}}>
      <span>{msg}</span>
      <button className="btn btn-ghost btn-sm" style={{padding:"4px 10px",minHeight:28}} onClick={onUndo}>Undo</button>
    </div>
  );
}

/* ── MODAL ───────────────────────────────────────────────────────────────── */
function Modal({ title, onClose, children, actions }) {
  useEffect(()=>{ const fn=e=>e.key==="Escape"&&onClose(); document.addEventListener("keydown",fn); return ()=>document.removeEventListener("keydown",fn); },[]);
  return (
    <div className="overlay" role="dialog" aria-modal="true" aria-labelledby={title?"modal-title":undefined} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        {title && <div id="modal-title" className="modal-title">{title}</div>}
        {children}
        {actions && <div className="modal-actions">{actions}</div>}
      </div>
    </div>
  );
}

/* ── TAG INPUT (Tech Stack) ─────────────────────────────────────────────── */
function TagInput({ value=[], options=[], onChange, placeholder="Add a tool…" }) {
  const [input,setInput]=useState("");
  const [open,setOpen]=useState(false);
  const q = input.trim().toLowerCase();
  const filtered = options.filter(o=>!value.includes(o) && o.toLowerCase().includes(q));
  const exactExists = options.some(o=>o.toLowerCase()===q) || value.some(v=>v.toLowerCase()===q);
  const addTag = tag => { const t=tag.trim(); if(!t||value.includes(t)) return; onChange([...value,t]); setInput(""); };
  const removeTag = tag => onChange(value.filter(v=>v!==tag));
  return (
    <div>
      {value.length>0&&(
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:7}}>
          {value.map(v=>(
            <span key={v} className="badge" style={{background:"var(--blue-tint)",color:"var(--blue)",display:"inline-flex",alignItems:"center",gap:5}}>
              {v}
              <button type="button" onClick={()=>removeTag(v)} aria-label={`Remove ${v}`}
                style={{background:"none",border:"none",color:"var(--blue)",cursor:"pointer",padding:0,fontSize:12,lineHeight:1}}>✕</button>
            </span>
          ))}
        </div>
      )}
      <div style={{position:"relative"}}>
        <input value={input}
          onChange={e=>{setInput(e.target.value);setOpen(true);}}
          onFocus={()=>setOpen(true)}
          onBlur={()=>setTimeout(()=>setOpen(false),150)}
          onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); addTag(input); } }}
          placeholder={placeholder}
          style={{width:"100%",background:"var(--bg)",border:"1px solid var(--border)",borderRadius:"var(--r)",color:"var(--text)",fontFamily:"var(--font)",fontSize:14,padding:"10px 12px",outline:"none"}} />
        {open&&input&&(filtered.length>0||!exactExists)&&(
          <div className="global-search-results">
            {filtered.slice(0,8).map(o=>(
              <div key={o} className="global-search-item" onMouseDown={()=>addTag(o)}>{o}</div>
            ))}
            {!exactExists&&(
              <div className="global-search-item" onMouseDown={()=>addTag(input)} style={{color:"var(--blue)"}}>+ Add "{input.trim()}"</div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── CONFIRM MODAL ───────────────────────────────────────────────────────── */
function ConfirmModal({ title="Are you sure?", message, confirmLabel="Delete", onConfirm, onCancel }) {
  return (
    <Modal title={title} onClose={onCancel} actions={
      <>
        <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
        <button className="btn btn-danger" style={{background:"rgba(248,113,113,.15)",borderColor:"var(--red)"}} onClick={onConfirm}>{confirmLabel}</button>
      </>
    }>

    </Modal>
  );
}

/* ── TASKS VIEW ──────────────────────────────────────────────────────────── */
function TasksView({ tasks, clients, comments, onAddComment, selectedClientId, onUpdate, notify, requestDelete, onNavigateClient }) {
  const [showForm,setShowForm]=useState(false);
  const [editTask,setEditTask]=useState(null);
  const [detailTask,setDetailTask]=useState(null);
  const [filter,setFilter]=useState("active");
  const [dragId,setDragId]=useState(null);
  const [dragOverId,setDragOverId]=useState(null);
  const [sortBy,setSortBy]=useState("manual");
  const [confirmTask,setConfirmTask]=useState(null);
  const [selectedIds,setSelectedIds]=useState([]);
  const [celebrateId,setCelebrateId]=useState(null);

  const SORTERS = {
    manual:   (a,b)=>(fmt(a)["Sort Order"]||0)-(fmt(b)["Sort Order"]||0),
    due:      (a,b)=>{ const da=fmt(a)["Due Date"],db=fmt(b)["Due Date"]; if(!da&&!db) return 0; if(!da) return 1; if(!db) return -1; return new Date(da)-new Date(db); },
    priority: (a,b)=>{ const order={High:0,Medium:1,Low:2,undefined:3}; return order[fmt(a).Priority]-order[fmt(b).Priority]; },
    created:  (a,b)=>new Date(fmt(b).Created||0)-new Date(fmt(a).Created||0),
  };

  const filtered = tasks
    .filter(t=>!selectedClientId||fmt(t).Client?.[0]===selectedClientId)
    .filter(t=>filter==="all"?true:filter==="active"?fmt(t).Status!=="Done":fmt(t).Status==="Done")
    .sort(SORTERS[sortBy]);

  const draggable = sortBy==="manual";

  const saveTask = async fields => {
    try {
      const f = clean(fields);
      if (editTask) await atUpdate("Tasks",editTask.id,f);
      else await atCreate("Tasks",{...f,"Sort Order":tasks.length});
      onUpdate(); setShowForm(false); setEditTask(null); notify("Task saved","success");
    } catch { notify("Error saving","error"); }
  };
  const toggleDone = async task => {
    const wasDone = fmt(task).Status==="Done";
    const s = wasDone ? "To Do" : "Done";
    if (!wasDone) { setCelebrateId(task.id); setTimeout(()=>setCelebrateId(id=>id===task.id?null:id), 800); }
    try { await atUpdate("Tasks",task.id,{Status:s}); onUpdate(); } catch { notify("Error","error"); }
  };
  const drop = async targetId => {
    if (!dragId||dragId===targetId) return;
    const ids=filtered.map(t=>t.id), from=ids.indexOf(dragId), to=ids.indexOf(targetId);
    const r=[...ids]; r.splice(from,1); r.splice(to,0,dragId);
    try { await Promise.all(r.map((id,i)=>atUpdate("Tasks",id,{"Sort Order":i}))); onUpdate(); }
    catch { notify("Error reordering","error"); }
    setDragId(null); setDragOverId(null);
  };
  const toggleSelect = (id,e) => { e.stopPropagation(); setSelectedIds(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]); };
  const bulkComplete = async () => {
    try { await Promise.all(selectedIds.map(id=>atUpdate("Tasks",id,{Status:"Done"}))); onUpdate(); notify(`${selectedIds.length} tasks marked done`,"success"); setSelectedIds([]); }
    catch { notify("Error","error"); }
  };
  const bulkDelete = () => {
    selectedIds.forEach(id=>{ const t=tasks.find(x=>x.id===id); if(t) requestDelete("Tasks",id,fmt(t).Title); });
    setSelectedIds([]);
  };
  const bulkReassign = async assignee => {
    try { await Promise.all(selectedIds.map(id=>atUpdate("Tasks",id,{Assignee:assignee}))); onUpdate(); notify(`Reassigned to ${assignee}`,"success"); setSelectedIds([]); }
    catch { notify("Error","error"); }
  };

  return (
    <div>
      <div className="section-header">
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <div className="tabs" role="tablist">
            {[["active","Active"],["done","Done"],["all","All"]].map(([v,l])=>(
              <button key={v} role="tab" aria-selected={filter===v} className={`tab ${filter===v?"active":""}`} onClick={()=>setFilter(v)}>{l}</button>
            ))}
          </div>
          <span className="section-count">{filtered.length} tasks</span>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <select className="sort-select" value={sortBy} onChange={e=>setSortBy(e.target.value)} aria-label="Sort tasks">
            <option value="manual">Manual order</option>
            <option value="due">Due date</option>
            <option value="priority">Priority</option>
            <option value="created">Newest</option>
          </select>
          <button className="btn btn-primary btn-sm" onClick={()=>setShowForm(true)}>+ New Task</button>
        </div>
      </div>

      {selectedIds.length>0&&(
        <div className="bulk-bar">
          <span>{selectedIds.length} selected</span>
          <button className="btn btn-ghost btn-sm" onClick={bulkComplete}>Mark Done</button>
          <select className="sort-select" defaultValue="" onChange={e=>{ if(e.target.value) bulkReassign(e.target.value); e.target.value=""; }} aria-label="Bulk reassign">
            <option value="">Reassign to…</option>
            {ASSIGNEES.map(a=><option key={a} value={a}>{a}</option>)}
          </select>
          <button className="btn btn-danger btn-sm" onClick={bulkDelete}>Delete</button>
          <button className="btn btn-ghost btn-sm" onClick={()=>setSelectedIds([])} style={{marginLeft:"auto"}}>Clear</button>
        </div>
      )}

      {!draggable&&filtered.length>0&&<div style={{fontSize:12,color:"var(--text-3)",marginBottom:8}}>Drag-to-reorder is available under "Manual order" sort.</div>}

      {filtered.length===0
        ? <div className="empty"><div className="empty-icon">✓</div><div className="empty-text">No tasks here</div></div>
        : filtered.map(task=>{
          const f=fmt(task);
          const clientName=clients.find(c=>c.id===f.Client?.[0]);
          const commentCount=comments.filter(c=>fmt(c).Task?.[0]===task.id).length;
          const overdue=f["Due Date"]&&new Date(f["Due Date"])<new Date()&&f.Status!=="Done";
          const isSelected=selectedIds.includes(task.id);
          return (
            <div key={task.id}
              className={`task-row ${f.Status==="Done"?"done":""} ${dragId===task.id?"dragging":""} ${dragOverId===task.id?"drag-over":""} ${celebrateId===task.id?"celebrating":""}`}
              role="button" tabIndex={0}
              aria-label={`Task: ${f.Title}${f.Status==="Done"?" (completed)":""}`}
              draggable={draggable} onDragStart={()=>draggable&&setDragId(task.id)} onDragEnd={()=>{setDragId(null);setDragOverId(null);}}
              onDragOver={e=>{ if(draggable){ e.preventDefault(); setDragOverId(task.id); } }} onDrop={()=>draggable&&drop(task.id)}
              onClick={()=>setDetailTask(task)}
              onKeyDown={e=>e.key==="Enter"&&setDetailTask(task)}>
              {draggable
                ? <div className="drag-handle" onClick={e=>e.stopPropagation()} aria-hidden="true">⠿</div>
                : <div className="task-select-box" role="checkbox" aria-checked={isSelected} aria-label="Select task"
                    onClick={e=>toggleSelect(task.id,e)}>{isSelected&&<span style={{color:"#0f172a",fontSize:11}}>✓</span>}</div>}
              <div className="task-check-wrap">
                <div className={`task-check ${f.Status==="Done"?"done":""}`}
                  role="checkbox" aria-checked={f.Status==="Done"} tabIndex={0}
                  onClick={e=>{e.stopPropagation();toggleDone(task);}}
                  onKeyDown={e=>e.key===" "&&(e.preventDefault(),toggleDone(task))}>
                  {f.Status==="Done"&&<span style={{color:"#0f172a",fontSize:11}}>✓</span>}
                </div>
                {celebrateId===task.id&&<BurstEffect />}
              </div>
              <div className="task-body">
                <div className={`task-title ${f.Status==="Done"?"done":""}`}>{f.Title}</div>
                <div className="task-meta">
                  <span className="tag" style={{background:`${STATUS_COLOR[f.Status]}1a`,color:STATUS_COLOR[f.Status]}}>{f.Status}</span>
                  {f.Priority&&<span className="tag" style={{background:`${PRIORITY_COLOR[f.Priority]}1a`,color:PRIORITY_COLOR[f.Priority]}}>{f.Priority}</span>}
                  {f.Assignee&&<span className="badge" style={{background:"var(--blue-tint)",color:"var(--blue)",fontSize:11}}>{f.Assignee}</span>}
                  {!selectedClientId&&clientName&&<span className="badge" style={{background:"var(--hover)",color:"var(--text-2)",fontSize:11}}>{fmt(clientName).Name}</span>}
                  {f["Due Date"]&&<span style={{fontSize:12,color:overdue?"var(--red)":"var(--text-3)",fontFamily:"var(--mono)"}}>{overdue?"⚠ ":""}{fmtDate(f["Due Date"])}</span>}
                  {commentCount>0&&<span style={{fontSize:12,color:"var(--text-3)"}}>💬 {commentCount}</span>}
                </div>
              </div>
              <div className="task-actions" onClick={e=>e.stopPropagation()}>
                <button className="btn-icon" aria-label="Edit task" onClick={()=>{setEditTask(task);setShowForm(true);}}>✏️</button>
                <button className="btn-icon" aria-label="Delete task" onClick={()=>setConfirmTask(task)}>🗑</button>
              </div>
            </div>
          );
        })
      }
      {(showForm||editTask)&&<TaskForm initial={editTask?fmt(editTask):null} clients={clients} selectedClientId={selectedClientId} onSave={saveTask} onClose={()=>{setShowForm(false);setEditTask(null);}} />}
      {detailTask&&<TaskDetail task={detailTask} clients={clients} comments={comments} onAddComment={onAddComment} onEdit={t=>{setDetailTask(null);setEditTask(t);setShowForm(true);}} onClose={()=>setDetailTask(null)} onNavigateClient={onNavigateClient} />}
      {confirmTask&&<ConfirmModal title="Delete task?" message={`"${fmt(confirmTask).Title}" will be removed. You can undo for a few seconds after.`} onCancel={()=>setConfirmTask(null)} onConfirm={()=>{ requestDelete("Tasks",confirmTask.id,fmt(confirmTask).Title); setConfirmTask(null); }} />}
    </div>
  );
}

/* ── COMMS VIEW ──────────────────────────────────────────────────────────── */
function CommsView({ comms, clients, tasks, selectedClientId, onUpdate, notify, requestDelete }) {
  const [showForm,setShowForm]=useState(false);
  const [editComm,setEditComm]=useState(null);
  const [confirmComm,setConfirmComm]=useState(null);
  const [linkFilter,setLinkFilter]=useState("all"); // all | unlinked
  const filtered=comms.filter(c=>!selectedClientId||fmt(c).Client?.[0]===selectedClientId)
    .filter(c=>linkFilter==="all"||!(fmt(c)["Linked Task"]?.length))
    .sort((a,b)=>new Date(fmt(b).Date||fmt(b).Created)-new Date(fmt(a).Date||fmt(a).Created));
  const saveComm=async fields=>{
    try {
      const f = clean(fields);
      if(editComm) await atUpdate("Comms Log",editComm.id,f); else await atCreate("Comms Log",f);
      onUpdate(); setShowForm(false); setEditComm(null); notify("Saved","success");
    } catch { notify("Error saving","error"); }
  };
  const TYPE_ICON={Call:"📞",Email:"✉️",Meeting:"🤝",Text:"💬",Other:"📝"};
  return (
    <div>
      <div className="section-header">
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <span className="section-title">Comms Log</span>
          <div className="tabs" role="tablist">
            {[["all","All"],["unlinked","Not linked to a task"]].map(([v,l])=>(
              <button key={v} role="tab" aria-selected={linkFilter===v} className={`tab ${linkFilter===v?"active":""}`} onClick={()=>setLinkFilter(v)}>{l}</button>
            ))}
          </div>
          <span className="section-count">{filtered.length} entries</span>
        </div>
        <button className="btn btn-primary btn-sm" onClick={()=>setShowForm(true)}>+ Log Comm</button>
      </div>
      {filtered.length===0
        ? <div className="empty"><div className="empty-icon">📋</div><div className="empty-text">No comms logged yet</div></div>
        : filtered.map(comm=>{
          const f=fmt(comm);
          const client=clients.find(c=>c.id===f.Client?.[0]);
          const linkedTask=tasks.find(t=>t.id===f["Linked Task"]?.[0]);
          return (
            <div key={comm.id} className="comm-row"
            role="button" tabIndex={0}
            aria-label={`${f.Type}: ${f.Summary}`}
            onClick={()=>{setEditComm(comm);setShowForm(true);}}
            onKeyDown={e=>e.key==="Enter"&&(setEditComm(comm),setShowForm(true))}>
              <div className="comm-left">
                <span style={{fontSize:20}}>{TYPE_ICON[f.Type]||"📝"}</span>
                <span className="comm-date">{fmtDate(f.Date||f.Created)}</span>
                <span style={{fontSize:11,fontFamily:"var(--mono)",color:"var(--blue)"}}>{f.Author}</span>
              </div>
              <div className="comm-body">
                <div className="comm-summary">{f.Summary}</div>
                <div style={{display:"flex",gap:7,marginTop:4,flexWrap:"wrap"}}>
                  <span className="badge" style={{background:"var(--hover)",color:"var(--text-2)"}}>{f.Type}</span>
                  {!selectedClientId&&client&&<span className="badge" style={{background:"var(--hover)",color:"var(--text-2)"}}>{fmt(client).Name}</span>}
                  {linkedTask&&<span className="badge" style={{background:"var(--blue-tint)",color:"var(--blue)"}}>↗ {fmt(linkedTask).Title}</span>}
                  <span className="badge" style={f.Visibility==="Client-Visible"
                    ? {background:"rgba(74,222,154,.15)",color:"var(--green)"}
                    : {background:"var(--hover)",color:"var(--text-3)"}}>
                    {f.Visibility==="Client-Visible" ? "👁 Client-visible" : "🔒 Internal"}
                  </span>
                </div>
                {f.Notes&&<div className="comm-notes">{f.Notes}</div>}
              </div>
              <div onClick={e=>e.stopPropagation()} style={{flexShrink:0}}>
                <button className="btn-icon" aria-label="Delete comm entry" onClick={()=>setConfirmComm(comm)}>🗑</button>
              </div>
            </div>
          );
        })
      }
      {(showForm||editComm)&&<CommForm initial={editComm?fmt(editComm):null} clients={clients} tasks={tasks} selectedClientId={selectedClientId} onSave={saveComm} onClose={()=>{setShowForm(false);setEditComm(null);}} />}
      {confirmComm&&<ConfirmModal title="Delete comm entry?" message={`"${fmt(confirmComm).Summary}" will be removed. You can undo for a few seconds after.`} onCancel={()=>setConfirmComm(null)} onConfirm={()=>{ requestDelete("Comms Log",confirmComm.id,fmt(confirmComm).Summary); setConfirmComm(null); }} />}
    </div>
  );
}

/* ── CLIENT DETAIL ───────────────────────────────────────────────────────── */
function ClientDetail({ client, clients, tasks, comms, comments, onAddComment, onUpdate, onEdit, notify, requestDelete, techOptions=[], onNavigateClient }) {
  const [tab,setTab]=useState("activity");
  const [copied,setCopied]=useState(false);
  const [confirmDelete,setConfirmDelete]=useState(false);
  const f=fmt(client);
  const [keyInfo,setKeyInfo]=useState({ "Shared Folder URL":f["Shared Folder URL"]||"", "Meeting Link":f["Meeting Link"]||"", "Contract URL":f["Contract URL"]||"" });
  useEffect(()=>{ setKeyInfo({ "Shared Folder URL":f["Shared Folder URL"]||"", "Meeting Link":f["Meeting Link"]||"", "Contract URL":f["Contract URL"]||"" }); },[client.id]);
  const saveKeyInfo = async (key,value) => {
    try { await atUpdate("Clients",client.id,{[key]:value||null}); onUpdate(); } catch { notify("Error saving link","error"); }
  };
  const clientTasks=tasks.filter(t=>fmt(t).Client?.[0]===client.id);
  const doneTasks=clientTasks.filter(t=>fmt(t).Status==="Done").length;
  const clientComms=comms.filter(c=>fmt(c).Client?.[0]===client.id);
  const stale = ["Prospect","Pre-Engagement"].includes(f.Stage) && lastActivityDays(client.id,tasks,comms) >= 14;
  const portalUrl = `${window.location.origin}${window.location.pathname}?client=${slugify(f.Name)}`;
  const copyPortalLink = () => { navigator.clipboard?.writeText(portalUrl); setCopied(true); setTimeout(()=>setCopied(false),2000); };

  // Combined activity feed: tasks + comms, newest first
  const activity = [
    ...clientTasks.map(t=>({type:"task",date:fmt(t).Created,record:t})),
    ...clientComms.map(c=>({type:"comm",date:fmt(c).Date||fmt(c).Created,record:c})),
  ].filter(a=>a.date).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const TYPE_ICON={Call:"📞",Email:"✉️",Meeting:"🤝",Text:"💬",Other:"📝"};

  return (
    <div className="detail-panel">
      <div className="detail-header">
        <div>
          <div className="detail-name">{f.Name}</div>
          <div className="detail-meta">
            <span className="tag" style={{background:`${STAGE_COLOR[f.Stage]}1a`,color:STAGE_COLOR[f.Stage]}}>{f.Stage}</span>
            {f.Difficulty&&<span className="tag" style={{background:`${SIZE_COLOR[f.Difficulty]}1a`,color:SIZE_COLOR[f.Difficulty]}}>{f.Difficulty}</span>}
            {f.Industry&&<span style={{fontSize:13,color:"var(--text-3)"}}>{f.Industry}</span>}
            {stale&&<span className="stale-flag">⚠ No activity {lastActivityDays(client.id,tasks,comms)}d</span>}
          </div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>onEdit(client)}>Edit</button>
          <button className="btn btn-danger btn-sm" onClick={()=>setConfirmDelete(true)}>Delete</button>
        </div>
      </div>
      <div className="portal-link-row">
        <code>{portalUrl}</code>
        <button className="btn btn-ghost btn-sm" onClick={copyPortalLink}>{copied?"Copied ✓":"Copy Portal Link"}</button>
      </div>
      <div style={{marginBottom:18}}>
        <label style={{display:"block",fontFamily:"var(--mono)",fontSize:11,letterSpacing:"1px",textTransform:"uppercase",color:"var(--text-3)",marginBottom:7}}>
          Key Information <span style={{textTransform:"none",fontFamily:"var(--font)",fontWeight:400,color:"var(--text-3)"}}>— filled-in links show on the client portal</span>
        </label>
        {KEY_INFO_FIELDS.map(k=>(
          <div key={k.key} className="key-info-row">
            <span className="key-info-icon" aria-hidden="true">{k.icon}</span>
            <input value={keyInfo[k.key]} placeholder={k.placeholder} type="url"
              onChange={e=>setKeyInfo(p=>({...p,[k.key]:e.target.value}))}
              onBlur={()=>saveKeyInfo(k.key,keyInfo[k.key])} />
            {keyInfo[k.key]
              ? <a className="key-info-open" href={keyInfo[k.key]} target="_blank" rel="noopener noreferrer" title={`Open ${k.label}`}>↗</a>
              : <span className="key-info-open" style={{opacity:.4}} title="Not set — hidden from client portal">🔒</span>}
          </div>
        ))}
      </div>
      <div style={{marginBottom:18}}>
        <label style={{display:"block",fontFamily:"var(--mono)",fontSize:11,letterSpacing:"1px",textTransform:"uppercase",color:"var(--text-3)",marginBottom:7}}>Tech Stack</label>
        <TagInput value={f["Tech Stack"]||[]} options={techOptions} placeholder="Add a tool used with this client…"
          onChange={async v=>{ try { await atUpdate("Clients",client.id,{"Tech Stack":v}); onUpdate(); } catch { notify("Error saving tech stack","error"); } }} />
      </div>
      <div className="detail-grid">
        {f["Owner Contact"]&&<div className="detail-field"><label>Contact</label><span>{f["Owner Contact"]}</span></div>}
        {f.Email&&<div className="detail-field"><label>Email</label><span>{f.Email}</span></div>}
        {f.Phone&&<div className="detail-field"><label>Phone</label><span>{f.Phone}</span></div>}
        {f["Recommended Quote"]&&<div className="detail-field"><label>Quote</label><span>${Number(f["Recommended Quote"]).toLocaleString()}</span></div>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:18}}>
        {[["Tasks",clientTasks.length],["Done",doneTasks],["Comms",clientComms.length]].map(([l,v])=>(
          <div key={l} style={{background:"var(--bg)",borderRadius:"var(--r)",padding:"10px 12px",textAlign:"center"}}>
            <div style={{fontSize:20,fontWeight:700,color:"var(--text)"}}>{v}</div>
            <div style={{fontSize:10,fontFamily:"var(--mono)",color:"var(--text-3)",letterSpacing:.8,textTransform:"uppercase",marginTop:2}}>{l}</div>
          </div>
        ))}
      </div>
      {f.Notes&&<div style={{marginBottom:18,fontSize:14,color:"var(--text-2)",background:"var(--bg)",borderRadius:"var(--r)",padding:"11px 13px",whiteSpace:"pre-wrap",lineHeight:1.55}}>{f.Notes}</div>}
      <div className="tabs" role="tablist">
        {[["activity","Activity"],["tasks","Tasks"],["comms","Comms"]].map(([v,l])=>(
          <button key={v} role="tab" aria-selected={tab===v} className={`tab ${tab===v?"active":""}`} onClick={()=>setTab(v)}>{l}</button>
        ))}
      </div>
      {tab==="activity"&&(
        activity.length===0
          ? <div className="empty"><div className="empty-icon">◎</div><div className="empty-text">No activity yet</div></div>
          : activity.map(a=>{
            if (a.type==="task") {
              const tf=fmt(a.record);
              return (
                <div key={"t"+a.record.id} className="task-row" style={{cursor:"default"}}>
                  <div className={`task-check ${tf.Status==="Done"?"done":""}`} aria-hidden="true">{tf.Status==="Done"&&<span style={{color:"#0f172a",fontSize:11}}>✓</span>}</div>
                  <div className="task-body">
                    <div className={`task-title ${tf.Status==="Done"?"done":""}`}>{tf.Title}</div>
                    <div className="task-meta">
                      <span className="tag" style={{background:`${STATUS_COLOR[tf.Status]}1a`,color:STATUS_COLOR[tf.Status]}}>{tf.Status}</span>
                      <span style={{fontSize:12,color:"var(--text-3)",fontFamily:"var(--mono)"}}>{fmtDate(a.date)}</span>
                    </div>
                  </div>
                </div>
              );
            }
            const cf=fmt(a.record);
            return (
              <div key={"c"+a.record.id} className="comm-row" style={{cursor:"default"}}>
                <div className="comm-left">
                  <span style={{fontSize:20}}>{TYPE_ICON[cf.Type]||"📝"}</span>
                  <span className="comm-date">{fmtDate(a.date)}</span>
                </div>
                <div className="comm-body">
                  <div className="comm-summary">{cf.Summary}</div>
                  <div style={{display:"flex",gap:6,marginTop:4}}>
                    <span className="badge" style={{background:"var(--hover)",color:"var(--text-2)"}}>{cf.Type}</span>
                    <span className="badge" style={cf.Visibility==="Client-Visible"
                      ? {background:"rgba(74,222,154,.15)",color:"var(--green)"}
                      : {background:"var(--hover)",color:"var(--text-3)"}}>
                      {cf.Visibility==="Client-Visible" ? "👁 Client-visible" : "🔒 Internal"}
                    </span>
                  </div>
                </div>
              </div>
            );
          })
      )}
      {tab==="tasks"&&<TasksView tasks={tasks} clients={clients} comments={comments} onAddComment={onAddComment} selectedClientId={client.id} onUpdate={onUpdate} notify={notify} requestDelete={requestDelete} onNavigateClient={onNavigateClient} />}
      {tab==="comms"&&<CommsView comms={comms} clients={clients} tasks={tasks} selectedClientId={client.id} onUpdate={onUpdate} notify={notify} requestDelete={requestDelete} />}
      {confirmDelete&&<ConfirmModal title="Delete client?" message={`"${f.Name}" will be removed. Their tasks and comms will remain but unlinked. You can undo for a few seconds after.`} onCancel={()=>setConfirmDelete(false)} onConfirm={()=>{ requestDelete("Clients",client.id,f.Name); setConfirmDelete(false); }} />}
    </div>
  );
}

/* ── CLIENTS VIEW ────────────────────────────────────────────────────────── */
function ClientsView({ clients, tasks, comms, comments, onAddComment, onUpdate, notify, requestDelete, stageFilter, toolFilter, onClearStageFilter, onClearToolFilter, initialClientId, onNavigateClient }) {
  const [selected,setSelected]=useState(initialClientId||null);
  const [showForm,setShowForm]=useState(false);
  const [editClient,setEditClient]=useState(null);
  const [search,setSearch]=useState("");
  const [sortBy,setSortBy]=useState("name");

  useEffect(()=>{ if(initialClientId) setSelected(initialClientId); },[initialClientId]);

  const techOptions = allTechStackOptions(clients);

  const SORTERS = {
    name:    (a,b)=>(fmt(a).Name||"").localeCompare(fmt(b).Name||""),
    stage:   (a,b)=>STAGES.indexOf(fmt(a).Stage)-STAGES.indexOf(fmt(b).Stage),
    quote:   (a,b)=>(Number(fmt(b)["Recommended Quote"])||0)-(Number(fmt(a)["Recommended Quote"])||0),
    created: (a,b)=>new Date(fmt(b).Created||0)-new Date(fmt(a).Created||0),
    diff:    (a,b)=>SIZES.indexOf(fmt(a).Difficulty)-SIZES.indexOf(fmt(b).Difficulty),
  };

  const filtered = clients
    .filter(c=>fmt(c).Name?.toLowerCase().includes(search.toLowerCase()))
    .filter(c=>!stageFilter||fmt(c).Stage===stageFilter)
    .filter(c=>!toolFilter||(fmt(c)["Tech Stack"]||[]).includes(toolFilter))
    .sort(SORTERS[sortBy]);

  const saveClient=async fields=>{
    try {
      const f = clean(fields);
      if (editClient) await atUpdate("Clients",editClient.id,f); else await atCreate("Clients",f);
      onUpdate(); setShowForm(false); setEditClient(null); notify("Client saved","success");
    } catch { notify("Error saving","error"); }
  };
  const selectedClient=clients.find(c=>c.id===selected);
  return (
    <div>
      {stageFilter&&(
        <div className="bulk-bar" style={{marginBottom:14}}>
          <span>Filtered to stage: {stageFilter}</span>
          <button className="btn btn-ghost btn-sm" onClick={onClearStageFilter} style={{marginLeft:"auto"}}>✕ Clear</button>
        </div>
      )}
      {toolFilter&&(
        <div className="bulk-bar" style={{marginBottom:14}}>
          <span>Using: {toolFilter}</span>
          <button className="btn btn-ghost btn-sm" onClick={onClearToolFilter} style={{marginLeft:"auto"}}>✕ Clear</button>
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:selected?"280px 1fr":"1fr",gap:18}}>
        <div>
          <div className="section-header">
            <input className="search-input" placeholder="Search clients…" value={search} onChange={e=>setSearch(e.target.value)} aria-label="Search clients" />
            <div style={{display:"flex",gap:8}}>
              <select className="sort-select" value={sortBy} onChange={e=>setSortBy(e.target.value)} aria-label="Sort clients">
                <option value="name">Name A–Z</option>
                <option value="stage">Stage</option>
                <option value="quote">Quote (high–low)</option>
                <option value="created">Newest</option>
                <option value="diff">Difficulty</option>
              </select>
              <button className="btn btn-primary btn-sm" onClick={()=>{setEditClient(null);setShowForm(true);}}>+ New</button>
            </div>
          </div>
          {filtered.map(c=>{
            const f=fmt(c), taskCount=tasks.filter(t=>fmt(t).Client?.[0]===c.id).length;
            const stale = ["Prospect","Pre-Engagement"].includes(f.Stage) && lastActivityDays(c.id,tasks,comms) >= 14;
            const stack = f["Tech Stack"]||[];
            return (
              <div key={c.id} className={`client-card ${selected===c.id?"selected":""}`}
                role="button" tabIndex={0} aria-pressed={selected===c.id}
                onClick={()=>setSelected(c.id===selected?null:c.id)}
                onKeyDown={e=>e.key==="Enter"&&setSelected(c.id===selected?null:c.id)}>
                <div className="client-card-name">{f.Name}</div>
                <div className="client-card-meta">
                  <span className="tag" style={{background:`${STAGE_COLOR[f.Stage]}1a`,color:STAGE_COLOR[f.Stage]}}>{f.Stage}</span>
                  {f.Difficulty&&<span className="tag" style={{background:`${SIZE_COLOR[f.Difficulty]}1a`,color:SIZE_COLOR[f.Difficulty]}}>{f.Difficulty}</span>}
                  {stale&&<span className="stale-flag">⚠ stale</span>}
                </div>
                <div className="client-card-stats">
                  {f.Industry&&<span className="client-card-stat">{f.Industry}</span>}
                  <span className="client-card-stat"><span>{taskCount}</span> tasks</span>
                  {f["Recommended Quote"]&&<span className="client-card-stat"><span>${Number(f["Recommended Quote"]).toLocaleString()}</span></span>}
                </div>
                {stack.length>0&&(
                  <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:8}}>
                    {stack.slice(0,4).map(t=><span key={t} className="badge" style={{background:"var(--hover)",color:"var(--text-2)",fontSize:11}}>{t}</span>)}
                    {stack.length>4&&<span className="badge" style={{background:"var(--hover)",color:"var(--text-3)",fontSize:11}}>+{stack.length-4}</span>}
                  </div>
                )}
              </div>
            );
          })}
          {filtered.length===0&&<div className="empty"><div className="empty-text">No clients found</div></div>}
        </div>
        {selectedClient&&<ClientDetail client={selectedClient} clients={clients} tasks={tasks} comms={comms} comments={comments} onAddComment={onAddComment} onUpdate={onUpdate} onEdit={c=>{setEditClient(c);setShowForm(true);}} notify={notify} requestDelete={requestDelete} techOptions={techOptions} onNavigateClient={id=>{ setSelected(id); onNavigateClient&&onNavigateClient(id); }} />}
        {showForm&&<ClientForm initial={editClient?fmt(editClient):null} techOptions={techOptions} onSave={saveClient} onClose={()=>{setShowForm(false);setEditClient(null);}} />}
      </div>
    </div>
  );
}

/* ── PIPELINE VIEW ───────────────────────────────────────────────────────── */
function PipelineView({ clients, tasks, comms, onUpdate, notify, onOpenClient }) {
  const move=async(id,stage)=>{
    try { await atUpdate("Clients",id,{Stage:stage}); onUpdate(); notify(`Moved to ${stage}`,"success"); } catch { notify("Error","error"); }
  };
  return (
    <div>
      <div className="section-header"><span className="section-title">Pipeline</span></div>
      <div className="pipeline">
        {STAGES.map(stage=>{
          const sc=clients.filter(c=>fmt(c).Stage===stage);
          return (
            <div key={stage} className="pipeline-col">
              <div className="pipeline-col-header">
                <span style={{color:STAGE_COLOR[stage]}}>{stage}</span>
                <span style={{fontSize:12,fontFamily:"var(--mono)",color:"var(--text-3)"}}>{sc.length}</span>
              </div>
              {sc.map(c=>{
                const f=fmt(c), open=tasks.filter(t=>fmt(t).Client?.[0]===c.id&&fmt(t).Status!=="Done").length;
                const stale = ["Prospect","Pre-Engagement"].includes(f.Stage) && lastActivityDays(c.id,tasks,comms) >= 14;
                return (
                  <div key={c.id} className="pipeline-client"
                    role="button" tabIndex={0}
                    onClick={()=>onOpenClient&&onOpenClient(c.id)}
                    onKeyDown={e=>e.key==="Enter"&&onOpenClient&&onOpenClient(c.id)}>
                    <div className="pipeline-client-name">{f.Name}</div>
                    <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:7}}>
                      {f.Difficulty&&<span className="tag" style={{background:`${SIZE_COLOR[f.Difficulty]}1a`,color:SIZE_COLOR[f.Difficulty],fontSize:10}}>{f.Difficulty}</span>}
                      {open>0&&<span style={{fontSize:11,color:"var(--text-3)",fontFamily:"var(--mono)"}}>{open} open</span>}
                      {stale&&<span className="stale-flag">⚠ stale</span>}
                    </div>
                    {f["Recommended Quote"]&&<div style={{fontSize:12,color:"var(--green)",fontFamily:"var(--mono)",marginBottom:8}}>${Number(f["Recommended Quote"]).toLocaleString()}</div>}
                    <div style={{display:"flex",gap:4,flexWrap:"wrap"}} onClick={e=>e.stopPropagation()}>
                      {STAGES.filter(s=>s!==stage).map(s=>(
                        <button key={s} className="btn btn-ghost" style={{padding:"2px 7px",fontSize:11,borderRadius:4}} onClick={()=>move(c.id,s)}>→ {s}</button>
                      ))}
                    </div>
                  </div>
                );
              })}
              {sc.length===0&&<div style={{fontSize:13,color:"var(--text-3)",textAlign:"center",padding:"18px 0"}}>Empty</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ── DASHBOARD ───────────────────────────────────────────────────────────── */
function Dashboard({ clients, tasks, comms, onNavigate }) {
  const active=clients.filter(c=>fmt(c).Stage==="Active").length;
  const open=tasks.filter(t=>fmt(t).Status!=="Done").length;
  const overdue=tasks.filter(t=>{const f=fmt(t);return f["Due Date"]&&new Date(f["Due Date"])<new Date()&&f.Status!=="Done";}).length;
  const pipeline=clients.filter(c=>["Prospect","Pre-Engagement"].includes(fmt(c).Stage)).length;
  const quoted=clients.reduce((s,c)=>s+(Number(fmt(c)["Recommended Quote"])||0),0);
  const recentComms=[...comms].sort((a,b)=>new Date(fmt(b).Date||fmt(b).Created)-new Date(fmt(a).Date||fmt(a).Created)).slice(0,5);
  const upcoming=tasks.filter(t=>fmt(t)["Due Date"]&&fmt(t).Status!=="Done").sort((a,b)=>new Date(fmt(a)["Due Date"])-new Date(fmt(b)["Due Date"])).slice(0,6);
  const staleCount = clients.filter(c=>["Prospect","Pre-Engagement"].includes(fmt(c).Stage) && lastActivityDays(c.id,tasks,comms)>=14).length;
  const [techSearch,setTechSearch]=useState("");
  const techFreq = techStackFrequency(clients); // [[tag,count], ...] most-used first
  const techMatches = techSearch.trim() ? techFreq.filter(([t])=>t.toLowerCase().includes(techSearch.trim().toLowerCase())) : [];
  return (
    <div>
      <div className="stats-row">
        <div className="stat-card" role="button" tabIndex={0} onClick={()=>onNavigate("clients",{stage:"Active"})} onKeyDown={e=>e.key==="Enter"&&onNavigate("clients",{stage:"Active"})}>
          <div className="stat-label">Active</div><div className="stat-value">{active}</div><div className="stat-sub">{pipeline} in pipeline{staleCount>0?` · ${staleCount} stale`:""}</div>
        </div>
        <div className="stat-card" role="button" tabIndex={0} onClick={()=>onNavigate("tasks")} onKeyDown={e=>e.key==="Enter"&&onNavigate("tasks")}>
          <div className="stat-label">Open Tasks</div><div className="stat-value">{open}</div><div className="stat-sub" style={{color:overdue>0?"var(--red)":undefined}}>{overdue>0?`${overdue} overdue`:"on track"}</div>
        </div>
        <div className="stat-card" role="button" tabIndex={0} onClick={()=>onNavigate("clients")} onKeyDown={e=>e.key==="Enter"&&onNavigate("clients")}>
          <div className="stat-label">Clients</div><div className="stat-value">{clients.length}</div><div className="stat-sub">all stages</div>
        </div>
        <div className="stat-card" role="button" tabIndex={0} onClick={()=>onNavigate("pipeline")} onKeyDown={e=>e.key==="Enter"&&onNavigate("pipeline")}>
          <div className="stat-label">Quoted</div><div className="stat-value" style={{fontSize:22}}>${quoted>0?(quoted/1000).toFixed(0)+"k":"0"}</div><div className="stat-sub">pipeline</div>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
        <div>
          <div className="section-header" style={{marginBottom:10}}><span className="section-title">Upcoming Due</span></div>
          {upcoming.length===0
            ? <div className="empty" style={{padding:"22px"}}><div className="empty-text">Nothing due</div></div>
            : upcoming.map(t=>{
              const f=fmt(t), ov=new Date(f["Due Date"])<new Date();
              return (
                <div key={t.id} className="task-row" role="button" tabIndex={0}
                  onClick={()=>onNavigate("tasks",{client:f.Client?.[0]||null})}
                  onKeyDown={e=>e.key==="Enter"&&onNavigate("tasks",{client:f.Client?.[0]||null})}>
                  <div className="task-body">
                    <div className="task-title">{f.Title}</div>
                    <div className="task-meta">
                      <span style={{fontSize:12,color:ov?"var(--red)":"var(--text-3)",fontFamily:"var(--mono)"}}>{ov?"⚠ ":""}{fmtDate(f["Due Date"])}</span>
                      {f.Assignee&&<span className="badge" style={{background:"var(--blue-tint)",color:"var(--blue)",fontSize:11}}>{f.Assignee}</span>}
                    </div>
                  </div>
                </div>
              );
            })
          }
        </div>
        <div>
          <div className="section-header" style={{marginBottom:10}}><span className="section-title">Recent Comms</span></div>
          {recentComms.length===0
            ? <div className="empty" style={{padding:"22px"}}><div className="empty-text">None logged yet</div></div>
            : recentComms.map(c=>{
              const f=fmt(c);
              return (
                <div key={c.id} className="card" style={{padding:"11px 14px",marginBottom:6,cursor:"pointer"}} role="button" tabIndex={0}
                  onClick={()=>onNavigate("comms",{client:f.Client?.[0]||null})}
                  onKeyDown={e=>e.key==="Enter"&&onNavigate("comms",{client:f.Client?.[0]||null})}>
                  <div style={{fontSize:14,fontWeight:500,color:"var(--text)",marginBottom:4}}>{f.Summary}</div>
                  <div style={{display:"flex",gap:8}}>
                    <span style={{fontSize:12,fontFamily:"var(--mono)",color:"var(--blue)"}}>{f.Author}</span>
                    <span style={{fontSize:12,color:"var(--text-3)"}}>{f.Type}</span>
                    <span style={{fontSize:12,color:"var(--text-3)",marginLeft:"auto"}}>{fmtDate(f.Date||f.Created)}</span>
                  </div>
                </div>
              );
            })
          }
        </div>
      </div>
      <div style={{marginTop:18}}>
        <div className="section-header" style={{marginBottom:10}}>
          <span className="section-title">Tech Stack<span className="section-count">{techFreq.length} tools in use</span></span>
          <div style={{position:"relative",width:220}}>
            <input className="search-input" style={{width:"100%"}} placeholder="Find clients using…" value={techSearch}
              onChange={e=>setTechSearch(e.target.value)} aria-label="Search tech stack" />
            {techSearch.trim()&&(
              <div className="global-search-results">
                {techMatches.length===0
                  ? <div className="global-search-item" style={{cursor:"default",color:"var(--text-3)",fontSize:13}}>No matches</div>
                  : techMatches.slice(0,8).map(([t,count])=>(
                    <div key={t} className="global-search-item" onMouseDown={()=>onNavigate("clients",{tool:t})}>
                      <div className="global-search-item-label">{t}</div>
                      <div className="global-search-item-meta">{count} client{count===1?"":"s"}</div>
                    </div>
                  ))
                }
              </div>
            )}
          </div>
        </div>
        {techFreq.length===0
          ? <div className="empty" style={{padding:"22px"}}><div className="empty-text">No tools logged yet — add them from a client's page</div></div>
          : <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
              {techFreq.map(([tag,count])=>(
                <span key={tag} className="badge" role="button" tabIndex={0}
                  style={{background:"var(--hover)",color:"var(--text-2)",cursor:"pointer",display:"inline-flex",alignItems:"center",gap:6,padding:"6px 12px"}}
                  onClick={()=>onNavigate("clients",{tool:tag})}
                  onKeyDown={e=>e.key==="Enter"&&onNavigate("clients",{tool:tag})}>
                  {tag}<span style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--text-3)"}}>{count}</span>
                </span>
              ))}
            </div>
        }
      </div>
    </div>
  );
}

function slugify(name) {
  return (name||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}

            <div className="portal-section">
              <div className="portal-section-title">Completed</div>
              {doneTasks.map(task=>{
                const tf=fmt(task);
                return (
                  <div key={task.id} className="portal-task" style={{opacity:.5}}>
                    <div className="portal-task-check done" aria-hidden="true">
                      <span style={{color:"#0f172a",fontSize:10}}>✓</span>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div className="portal-task-title done">{tf.Title}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {tasks.length===0&&<div className="empty"><div className="empty-icon">✓</div><div className="empty-text">No tasks yet</div></div>}
        </>}

        {/* Comms */}
        {tab==="comms" && <>
          {comms.length===0
            ? <div className="empty"><div className="empty-icon">📋</div><div className="empty-text">No activity logged yet</div></div>
            : comms.map(comm=>{
              const cf=fmt(comm);
              return (
                <div key={comm.id} className="portal-comm">
                  <div className="portal-comm-header">
                    <span style={{fontSize:18}}>{TYPE_ICON[cf.Type]||"📝"}</span>
                    <span className="badge" style={{background:"var(--hover)",color:"var(--text-2)"}}>{cf.Type}</span>
                    <span style={{fontSize:12,fontFamily:"var(--mono)",color:"var(--text-3)",marginLeft:"auto"}}>{fmtDate(cf.Date||cf.Created)}</span>
                  </div>
                  <div className="portal-comm-summary">{cf.Summary}</div>
                  {cf.Notes&&<div className="portal-comm-notes">{cf.Notes}</div>}
                </div>
              );
            })
          }
        </>}

      </div>
    </div>
  );
}

  const [notif,setNotif]=useState(null);
  const [filterClient,setFilterClient]=useState(null);
  const [filterStage,setFilterStage]=useState(null);
  const [filterTool,setFilterTool]=useState(null);
  const [sidebarOpen,setSidebarOpen]=useState(true);
  const [pendingDeletes,setPendingDeletes]=useState({}); // id -> {table,label,timer}
  const [searchQuery,setSearchQuery]=useState("");
  const [searchOpen,setSearchOpen]=useState(false);
  const isMobile=()=>window.innerWidth<=720;

  const notify=(msg,type="success")=>setNotif({msg,type,id:Date.now()});

  const load=useCallback(async()=>{
    try {
      const [c,t,co,cm]=await Promise.all([
        atList("Clients",{sort:[{field:"Name"}]}),

        atList("Comms Log",{sort:[{field:"Date",dir:"desc"}]}),
        atList("Comments",{sort:[{field:"Created",dir:"desc"}]}),
      ]);
      setClients(c); setTasks(t); setComms(co); setComments(cm);
    } catch { notify("Error loading — check Airtable config","error"); }
    finally { setLoading(false); }
  },[]);

  useEffect(()=>{ load(); },[load]);
  useEffect(()=>{ if(isMobile()) setSidebarOpen(false); },[]);

  // Read initial view/client from URL on mount
  useEffect(()=>{
    const p = new URLSearchParams(window.location.search);
    const v = p.get("view"), c = p.get("client"), s = p.get("stage"), t = p.get("tool");
    if (v) setView(v);
    if (c) setFilterClient(c);
    if (s) setFilterStage(s);
    if (t) setFilterTool(t);
  },[]);

  const syncURL = (v, client, stage, tool) => {
    const p = new URLSearchParams();
    p.set("view", v);
    if (client) p.set("client", client);
    if (stage) p.set("stage", stage);
    if (tool) p.set("tool", tool);
    history.replaceState(null, "", `?${p.toString()}`);
  };

  const addComment=async fields=>{
    try { await atCreate("Comments",fields); load(); } catch (e) { notify(e.message || "Error adding comment","error"); }
  };

  // opts: { client, stage, tool } — passed depending on destination view
  const navigate=(v,opts={})=>{
    const client = opts.client!==undefined ? opts.client : null;
    const stage = opts.stage!==undefined ? opts.stage : null;
    const tool = opts.tool!==undefined ? opts.tool : null;
    setView(v); setFilterClient(client); setFilterStage(stage); setFilterTool(tool);
    syncURL(v, client, stage, tool);
    if(isMobile()) setSidebarOpen(false);
  };

  // ── Delete with undo ──────────────────────────────────────────────────
  const requestDelete = (table, id, label) => {
    const timer = setTimeout(async ()=>{
      try { await atDelete(table, id); load(); } catch { notify("Error deleting","error"); }
      setPendingDeletes(p=>{ const n={...p}; delete n[id]; return n; });
    }, 5000);
    setPendingDeletes(p=>({...p,[id]:{table,label,timer}}));
  };
  const undoDelete = id => {
    setPendingDeletes(p=>{
      const entry=p[id]; if(entry) clearTimeout(entry.timer);
      const n={...p}; delete n[id]; return n;
    });
  };

  const pendingIds = Object.keys(pendingDeletes);
  const visClients = clients.filter(c=>!pendingIds.includes(c.id));
  const visTasks   = tasks.filter(t=>!pendingIds.includes(t.id));
  const visComms   = comms.filter(c=>!pendingIds.includes(c.id));

  const isConfigured = true;

  const NAV=[
    {id:"dashboard",label:"Dashboard",icon:"◈"},
    {id:"pipeline", label:"Pipeline", icon:"▷"},
    {id:"clients",  label:"Clients",  icon:"◉"},
    {id:"tasks",    label:"All Tasks",icon:"◻"},
    {id:"comms",    label:"Comms Log",icon:"◎"},
  ];

  const openTaskCount=visTasks.filter(t=>fmt(t).Status!=="Done").length;
  const currentTitle = filterClient&&(view==="tasks"||view==="comms")
    ? `${fmt(visClients.find(c=>c.id===filterClient))?.Name||""} — ${view==="tasks"?"Tasks":"Comms"}`
    : NAV.find(n=>n.id===view)?.label||"";

  // ── Global search ─────────────────────────────────────────────────────
  const searchResults = (() => {
    const q = searchQuery.trim().toLowerCase();
    if (!q) return [];
    const results = [];
    visClients.forEach(c=>{ if(fmt(c).Name?.toLowerCase().includes(q)) results.push({type:"Client",label:fmt(c).Name,action:()=>navigate("clients",{client:c.id})}); });
    visTasks.forEach(t=>{ if(fmt(t).Title?.toLowerCase().includes(q)) results.push({type:"Task",label:fmt(t).Title,action:()=>navigate("tasks",{client:fmt(t).Client?.[0]||null})}); });
    visComms.forEach(c=>{ if(fmt(c).Summary?.toLowerCase().includes(q)) results.push({type:"Comm",label:fmt(c).Summary,action:()=>navigate("comms",{client:fmt(c).Client?.[0]||null})}); });
    return results.slice(0,8);
  })();

  return (
    <>
      <style>{CSS}</style>
      <div className="app">

        {/* Mobile overlay */}
        {sidebarOpen&&<div className="sidebar-overlay" onClick={()=>setSidebarOpen(false)} aria-hidden="true" />}

        {/* Sidebar */}
        <aside id="sidebar" className={`sidebar ${sidebarOpen?"":"collapsed"}`} aria-label="Navigation" aria-hidden={!sidebarOpen}>
          <div className="sidebar-logo">
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAMP0lEQVR42tWZfZAU9ZnHP7/unpfeeV3elhcBJSgkV1eAieILJjmVBNEoqAS8mJiYoIGolBiJMYllDEW8RBMuL3fEi1WmLMNpQCWQVYKo5wVXBORVQGAXXKPrsgsLM7M7OzPd/eSPnp237Zld9Y87f1VbO92/t+f1+7y0OnPSVAHBHYqy0fcoVAypWOSxv2xvlfNLzpPCbN95ynNd5QWaB3XFhZ73SpVDqxNXVTj9+FXFJ+V9jlT8MsqlKBUbvIhSgyNeqD7UAC8UA46+4w1vUyh5lkGeWtXcVP8rhNqCklrXqDKTM7x3qBoylnJVD0bi/daIB9fVNCtV2JA+DagaptC3UA2sXzVYRqSaKga8QyouUCiM6gfmD1GqFgh8iKEqpKsGsV6q6ksrgthHHFIJmYPhRX0oAagS3jQZrD0I3mqXqmb6gbiXfggoA8B2iQaUFzD3vfOUrFQQXgu9asCLlEpVDbzewxc1xUAXyQAHST/nKt9XLWoPxk9KBeuNfNqH88Zy4lQtl/AUggze4ZVXJlB8YVRTTe1cx33WNIUIaJqGiORXqgqo69vhvncc+SgQ1o9MYwDkqhqlHcehtzeDUorejPsfkXJWVamHKXRDxzSDGLqGbTuDuLNK1C7h3xg8apTjtqZprHxoBaNGNvD4H5/Ctp28JhxEBE3TyqhyHKH9+HH27H2TRCJJfTyG4zgVMadKrBEP4qWSgaqaLZlQGkopcrks9fE4115zFT6fD9M0yeVyaJo7DyD5S5VyzcxxbKLRKLqm8R+PPMrqJ9cSi0XzTORRS6naOZWq5FFKTagycavgSCmUnQUBn9+ks+sUN3zj24TDYTY0bkRTqmg+rjWhxCkjKBgMcMnFF/KLB5cz7owz+OlDv2RIfT22bXunWR4ZjlRAt3ILGmpHI6XAzuLUjwURjLb9KF0nlerGdhxi0ahLNCCSF4SmkEAEdD9KbEAhCJ2dnZw9cSKb/vI0X/n6LezctZtQKJR3bg8rGCCeGEUJKW/6lULZOexwA13zfodSGr5jr+IAuq6DCF227a7TtEJ01DuOENj9NFomiRMIgeNKefTIUew/cJANjRuZf/1ctjRtJRKJ4Dj2AKbs7ZdGQVuqVo3imo+Wagfdh97ZjKaKBmmoIpS6CtPIjj+P7inXUf/sXRjHD+IEY+BY2OIQDAZ5u/UdPj1tqgvFtUBEeUduCum0eAu/mKQKohmodBfxNd8BQE+8D0rPO5XCsiy6e3oIh0IYhoEgRByL5IULOXXD7xmy+pto7Qexg3Fy2SyJZJLp532aQ4ePuL5SM/P3qKlKONbjw0bePygoVQbKzqIcGwlGEX8d4g+R0/zER4zmX2Z+kXc7T3GyO0tO+elVAbSDL5Lu6SZ55XLMo1vwd7ejm1HuXrKYWTMv5a577sN2bJSmfcDKoFockAHSB6W7Cx0bFOiaTiKV5Fc/X87cq69kxxu7OHU6QSQSwbIsfIEAR/ds454Xn6Bt3iNMfP5OHrnvO9QNG8WCr32Ltrb3XQcWp6rDildVWqIJw7NQGrgmzEOaoOsar23dzj99ajJTp/wzP/zxCppbjhKLRbEsG8MfYPjezaTSGY7OXsni5UvpfGsbOSOURx8nj/8a4IA4/SUqqiy8q74EUpXBaDUGarRF8lOZbAZxhKV3LOK6OVdz2ew5vN9+nGg0imVZhCNR/JkukhcsJDFlAQ1rbsU40YwVjOchOofKpBAjAL5gKdj3i9R9abfk41aJD0iVLFCVP3t4nN/nxzAMNr7wIuPGjuFXDz9I48ZNpHvSDKmPI46N4wsRaHkFPVBHYtb9aCdaMLreQbN6kfAw0tNvAiuLnmgD3fBIo73zTKO61AefMTqOg1KK4cOHcc+PHkAEnlv3Jy6fPZfOzhPE4zE32kYaCG99FL c4nUhg1pkEAwGymSyp7m5i0QhK01Ao0r1pcjmLaNSt2lKpFOFwGL/fTyrVTTabIR6LY9k2qVQq3zNyQ3goHCYYDBSJp7KgKURiHRDsfCDTNA1xHByRogOWFBZ9jSmFi9dl0TQfkfsu7eve2Zbt2rquF9YX5my7cG+pcTgiJe3Isq+U5cO27WJvVYoEFuZqpNSl8yKCVbG+QEA+GyldX0pc5b3V0jONj+Mo6SUaHzviK5JVrewLivr4KUP7aF8X/6+UoEq+EysGrv7/H49/AOnfvI8sWN55AAAAAElFTkSuQmCC" alt="Rewire logo" style={{width:36,height:36,borderRadius:6,flexShrink:0}} />
              <div>
                <span style={{fontSize:16,fontWeight:700,color:"var(--text)",letterSpacing:"-.3px"}}>Rewire</span>
                <span className="sidebar-logo-sub">Project Ops</span>
              </div>
            </div>
            <button className="sidebar-close" onClick={()=>setSidebarOpen(false)} aria-label="Close menu">✕</button>
          </div>

          <div className="sidebar-section">Navigation</div>
          {NAV.map(n=>(
            <div key={n.id} className={`sidebar-item ${view===n.id&&!filterClient&&!filterStage&&!filterTool?"active":""}`}
              role="button" tabIndex={0}
              onClick={()=>navigate(n.id)}
              onKeyDown={e=>e.key==="Enter"&&navigate(n.id)}>
              <span style={{fontFamily:"var(--mono)",fontSize:14,flexShrink:0}}>{n.icon}</span>
              {n.label}
              {n.id==="tasks"&&openTaskCount>0&&<span className="count">{openTaskCount}</span>}
            </div>
          ))}

          {visClients.length>0&&<>
            <div className="sidebar-section" style={{marginTop:4}}>Clients</div>
            {visClients.map(c=>{
              const f=fmt(c);
              const overdueCount = visTasks.filter(t=>fmt(t).Client?.[0]===c.id&&fmt(t).Status!=="Done"&&fmt(t)["Due Date"]&&new Date(fmt(t)["Due Date"])<new Date()).length;
              return (
                <div key={c.id}
                  className={`sidebar-item ${filterClient===c.id&&view==="tasks"?"active":""}`}
                  role="button" tabIndex={0}
                  onClick={()=>navigate("tasks",{client:c.id})}
                  onKeyDown={e=>e.key==="Enter"&&navigate("tasks",{client:c.id})}>
                  <span className="dot" style={{background:STAGE_COLOR[f.Stage]||"var(--text-3)"}} />
                  <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.Name}</span>
                  {overdueCount>0&&<span className="count" style={{color:"var(--red)"}}>{overdueCount}</span>}
                </div>
              );
            })}
          </>}

          <div className="sidebar-footer">SC · AG · v1</div>
        </aside>

        {/* Main */}
        <main className="main">
          <div className="topbar">
            <button className="topbar-menu-btn" onClick={()=>setSidebarOpen(o=>!o)} aria-label={sidebarOpen?"Close menu":"Open menu"} aria-expanded={sidebarOpen} aria-controls="sidebar">
              {sidebarOpen
                ? <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 4h14M2 9h14M2 14h14" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round"/></svg>
                : <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 4h14M2 9h14M2 14h14" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round"/></svg>
              }
            </button>
            <div className="topbar-title">{currentTitle}</div>
            <div className="global-search-wrap">
              <input className="search-input" style={{width:"100%"}} placeholder="Search everything…" value={searchQuery}
                onChange={e=>{setSearchQuery(e.target.value);setSearchOpen(true);}}
                onFocus={()=>setSearchOpen(true)}
                onBlur={()=>setTimeout(()=>setSearchOpen(false),150)}
                aria-label="Global search" />
              {searchOpen&&searchQuery.trim()&&(
                <div className="global-search-results">
                  {searchResults.length===0
                    ? <div className="global-search-item" style={{cursor:"default",color:"var(--text-3)",fontSize:13}}>No matches</div>
                    : searchResults.map((r,i)=>(
                      <div key={i} className="global-search-item" onMouseDown={()=>{r.action();setSearchQuery("");setSearchOpen(false);}}>
                        <div className="global-search-item-label">{r.label}</div>
                        <div className="global-search-item-meta">{r.type}</div>
                      </div>
                    ))
                  }
                </div>
              )}
            </div>
            {(filterClient||filterStage||filterTool)&&(view==="tasks"||view==="comms"||view==="clients")&&(
              <button className="btn btn-ghost btn-sm" onClick={()=>navigate(view)}>✕ Clear</button>
            )}
            <button className="btn btn-ghost btn-sm" onClick={load} aria-label="Refresh data">↻</button>
          </div>

          <div className="content">
            {!isConfigured&&(
              <div className="warn-banner">⚠ Open this file in a text editor and replace <strong>YOUR_AIRTABLE_PAT</strong> and <strong>YOUR_BASE_ID</strong> near the top to connect your data.</div>
            )}
            {loading
              ? <div className="loading" role="status" aria-label="Loading"><div className="spinner" /><span className="loading-text">Loading…</span></div>
              : <>
                {view==="dashboard"&&<Dashboard clients={visClients} tasks={visTasks} comms={visComms} onNavigate={navigate} />}
                {view==="pipeline" &&<PipelineView clients={visClients} tasks={visTasks} comms={visComms} onUpdate={load} notify={notify} onOpenClient={id=>navigate("clients",{client:id})} />}
                {view==="clients"  &&<ClientsView clients={visClients} tasks={visTasks} comms={visComms} comments={comments} onAddComment={addComment} onUpdate={load} notify={notify} requestDelete={requestDelete} stageFilter={filterStage} toolFilter={filterTool} onClearStageFilter={()=>navigate("clients")} onClearToolFilter={()=>navigate("clients")} initialClientId={filterClient} onNavigateClient={id=>navigate("clients",{client:id})} />}
                {view==="tasks"    &&<TasksView tasks={visTasks} clients={visClients} comments={comments} onAddComment={addComment} selectedClientId={filterClient} onUpdate={load} notify={notify} requestDelete={requestDelete} onNavigateClient={id=>navigate("clients",{client:id})} />}
                {view==="comms"    &&<CommsView comms={visComms} clients={visClients} tasks={visTasks} selectedClientId={filterClient} onUpdate={load} notify={notify} requestDelete={requestDelete} />}
              </>
            }
          </div>
        </main>
      </div>
      {notif&&<Notif key={notif.id} msg={notif.msg} type={notif.type} onDone={()=>setNotif(null)} />}
      <div style={{position:"fixed",bottom:20,right:20,zIndex:200,display:"flex",flexDirection:"column",gap:8,alignItems:"flex-end"}}>
        {pendingIds.map(id=>(
          <UndoToast key={id} msg={`Deleted "${pendingDeletes[id].label||"item"}"`} onUndo={()=>undoDelete(id)} onExpire={()=>setPendingDeletes(p=>{const n={...p};delete n[id];return n;})} />
        ))}
      </div>
    </>
  );
}

const isClientPortal = new URLSearchParams(window.location.search).has("client") && !new URLSearchParams(window.location.search).has("view");
ReactDOM.createRoot(document.getElementById("root")).render(isClientPortal ? <ClientPortal /> : <App />);
</script>
</body>
</html>
